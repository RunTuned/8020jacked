# On every push to main: run the checks, then deploy to Fly.io. A failing check means no deploy.
# Needs one repository secret: FLY (or FLY_API_TOKEN) (Fly dashboard > Access Tokens). It is only given to the flyctl steps.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Create the Fly app on the first run
        env:
          FLY_API_TOKEN: ${{ secrets.FLY || secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::Add the FLY repository secret first."; exit 1; fi
          flyctl status --app app-8020jacked >/dev/null 2>&1 || flyctl apps create app-8020jacked
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY || secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
      - name: Smoke test
        run: |
          sleep 10
          curl -fsS https://app-8020jacked.fly.dev/manifest.webmanifest >/dev/null
          echo "Live: https://app-8020jacked.fly.dev"

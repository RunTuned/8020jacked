<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<title>8020jacked</title>
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url("/fonts/PlusJakartaSans-Variable.ttf") format("truetype");font-weight:200 800;font-display:swap}
:root{--canvas:#fff;--ink:#111;--muted:#555;--neutral:#f1f1f1;--on-ink:#fff}
@media (prefers-color-scheme:dark){:root{--canvas:#111;--ink:#f5f5f5;--muted:#b3b3b3;--neutral:#262626;--on-ink:#111}}
html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Plus Jakarta Sans",ui-rounded,system-ui,sans-serif;font-size:1.0625rem;line-height:1.5}
main{box-sizing:border-box;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:2rem;line-height:1.1;font-weight:800;letter-spacing:-0.02em;overflow-wrap:anywhere}
p{margin:0;color:var(--muted)}
button{font:inherit;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:999px;background:var(--ink);color:var(--on-ink);font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>No internet right now.</h1>
  <p>Your progress is saved on this phone. Try again when you are back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
